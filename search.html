<style> 
body { 
    font-family:Verdana, Geneva, Tahoma, sans-serif;
    background-image: url('0987.jpg'); /* نفس خلفية موقعك */
    background-size: cover; 
    background-repeat: no-repeat; 
    background-position: center; 
    background-attachment: fixed; 
    text-align: center; 
    padding-top: 15px;
    margin: 0;
} 

/* الهيدر والـ Navbar المتناسق مع تصميمك */
header {
    background-color: #000000;
    font-weight: bold;
    padding: 10px 20px;
    max-width: 1200px;
    margin: 0 auto 20px auto;
    border-radius: 50px;
    box-shadow: 0 0 15px #ffab03;
}

.navbar-container {
    display: flex;
    justify-content: center;
    gap: 40px;
    list-style: none;
    padding: 0;
    margin: 0;
}

.nav-link {
    color: #de980d;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    padding: 8px 16px;
    transition: 0.3s;
}

.nav-link:hover {
    color: #ffab03;
}

/* صندوق البحث */
.search-box-container {
    margin: 40px auto;
    max-width: 500px;
    padding: 0 20px;
}

.search-input {
    width: 100%;
    padding: 15px 25px;
    font-size: 20px;
    border: 2px solid #ffab03;
    border-radius: 50px;
    background-color: #000000d0;
    color: #fff;
    outline: none;
    text-align: center;
    box-shadow: 0 0 15px rgba(255, 171, 3, 0.3);
}

.search-input:focus {
    box-shadow: 0 0 25px #ffab03;
}

/* رسالة عذراً لم نجد منتج */
.no-results {
    color: #ffaa00;
    font-size: 24px;
    display: none;
    margin-top: 30px;
}

/* تنسيق الكروت لتطابق صفحة المنيو مع ميزة فرد الصورة */
.card {
    background-color: #8a6022c2; 
    border: 2px solid #ffab038a;
    border-radius: 30px; 
    width: 280px;
    overflow: hidden; 
    padding: 0; 
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    text-align: center;
    margin: 15px;
    display: inline-block;
    vertical-align: top;
}

.card img {
    width: 100%; 
    height: 210px;
    object-fit: cover; 
    display: block;
}

.card-body {
    padding: 15px;
}

h3 {
    font-size: 20px; 
    color: #ffab03; 
    margin: 10px 0;
}

.prise {
    font-size: 20px;
    color: #ffffff; 
    margin-bottom: 10px;
}

.order-btn {
    width: 120px;
    padding: 9px;
    background-color: #000000c8;
    border-radius: 25px;
    color: #de980dcf;
    border: 2px solid #de980d;
    font-weight: bold;
    cursor: pointer;
}

.order-btn:hover {
    background-color: #de980d;
    color: #000000;
}
</style> 
</head> 
<body>

    <!-- الكود السحري للبحث الفوري -->
    <script>
    function searchProducts() {
        // جلب الكلمة اللي كتبها المستخدم
        let filter = document.getElementById('searchInput').value.toLowerCase();
        // جلب كل الكروت
        let cards = document.getElementsByClassName('card');
        let anyVisible = false;

        for (let i = 0; i < cards.length; i++) {
            // قراءة الكلمات المفتاحية المكتوبة في الـ data-name
            let name = cards[i].getAttribute('data-name').toLowerCase();
            
            // لو الاسم يحتوي على الكلمة المكتوبة في السرش
            if (name.includes(filter)) {
                cards[i].style.display = "inline-block"; // إظهار الكارت
                anyVisible = true;
            } else {
                cards[i].style.display = "none"; // إخفاء الكارت
            }
        }

        // إظهار رسالة "لم نجد منتج" لو كل الكروت اختفت
        let noResults = document.getElementById('noResults');
        if (anyVisible) {
            noResults.style.display = "none";
        } else {
            noResults.style.display = "block";
        }
    }
    </script>
